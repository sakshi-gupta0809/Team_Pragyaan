

services:
  db:
    image: postgres:15
    container_name: email_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: emaildb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: email_backend
    restart: unless-stopped
    env_file:
      - .env
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app
      - ./backend/resources:/app/resources
      - ./backend/prompts:/app/prompts
      - ./backend/samples:/app/samples
      - ./backend/data:/app/data
    environment:
      # Ensure backend connects to DB container, not localhost
      POSTGRES_HOST: db
      DOCKER_ENV: "true"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:20-alpine
    container_name: email_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "9090:5175"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
